<!DOCTYPE html>
<html lang="en" data-theme="space">
<head>
    <meta charset="UTF-8">
    <script>(function(){try{var t=localStorage.getItem("site-theme");if(t==="earth"||t==="space")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Code — Adrian Mag</title>
    <link rel="stylesheet" href="../css/styles.css?v=5">
    <link rel="stylesheet" href="../css/theme.css?v=5">
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(120% 120% at 50% 0%, var(--ground-2, #1B1F27) 0%, var(--ground, #16191F) 100%);
        }
        .papers-login-card {
            background: var(--surface, #232833);
            border: 1px solid var(--line-2, rgba(143,180,221,0.22));
            border-radius: 16px;
            padding: 2.6rem 2.2rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow, 0 18px 46px -20px rgba(0,0,0,0.7));
        }
        .papers-login-card .monogram { margin: 0 auto 1.1rem; width: 42px; height: 42px; font-size: 1.1rem; }
        .papers-login-card h1 {
            font-family: var(--serif, Georgia, serif);
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 0.5rem 0;
            color: var(--text, #EAEFF6);
        }
        .papers-login-card p {
            font-size: 0.92rem;
            color: var(--muted, #9AA7B7);
            margin: 0 0 1.5rem 0;
        }
        .papers-login-card input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--line-2, rgba(143,180,221,0.22));
            border-radius: 10px;
            background: var(--ground, #16191F);
            color: var(--text, #EAEFF6);
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .papers-login-card input:focus {
            outline: none;
            border-color: var(--accent, #6791BE);
        }
        .papers-login-card button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            border: none;
            border-radius: 999px;
            background: var(--accent, #6791BE);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.18s;
        }
        .papers-login-card button:hover {
            background: var(--accent-bright, #9BC1E8);
            transform: translateY(-1px);
        }
        .papers-login-card button:disabled { opacity: 0.6; cursor: default; transform: none; }
        .papers-login-card .error-msg {
            color: #e08585;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
        .papers-login-card .error-msg.show { display: block; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta property="og:title" content="Access Code — Adrian Mag">
    <meta property="og:description" content="Adrian Mag's academic website: seismology, inverse theory, and long-form notes on inference.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adrian-mag.github.io/pages/papers-login.html">
    <meta property="og:image" content="https://adrian-mag.github.io/media/og-card.png">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <div class="papers-login-card">
        <span class="monogram">AM</span>
        <h1>Access Restricted</h1>
        <p>Please enter the access code to view the documents.</p>
        <form id="papers-login-form" autocomplete="off">
            <input type="password" id="papers-code-input" placeholder="Enter access code" autofocus>
            <button type="submit">Unlock</button>
        </form>
        <p class="error-msg" id="papers-error">Incorrect code. Please try again.</p>
    </div>

    <script src="../js/papers-crypto.js?v=5"></script>
    <script>
    (function () {
        "use strict";

        // The access code is the decryption key: it is verified by actually
        // decrypting a canary ciphertext (media/papers/vault-check.enc).
        // Nothing on this site or in its repository can reveal the documents
        // without the code.

        var form = document.getElementById("papers-login-form");
        var input = document.getElementById("papers-code-input");
        var errorMsg = document.getElementById("papers-error");
        var button = form.querySelector("button");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            var code = input.value;
            if (!code) return;
            errorMsg.classList.remove("show");
            button.disabled = true;
            button.textContent = "Checking…";

            window.PapersVault.verifyCode(code).then(function (ok) {
                if (ok) {
                    window.PapersVault.storeCode(code);
                    window.location.href = "papers-in-prep.html";
                } else {
                    button.disabled = false;
                    button.textContent = "Unlock";
                    errorMsg.classList.add("show");
                    input.value = "";
                    input.focus();
                }
            });
        });
    })();
    </script>
</body>
</html>
