<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Code — Adrian Mag</title>
    <link rel="stylesheet" href="../css/styles.css">
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1d23 0%, #2a2d35 100%);
        }
        .papers-login-card {
            background: #fff;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .papers-login-card .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #555;
        }
        .papers-login-card h1 {
            font-size: 1.4rem;
            margin: 0 0 0.5rem 0;
            color: #222;
        }
        .papers-login-card p {
            font-size: 0.9rem;
            color: #666;
            margin: 0 0 1.5rem 0;
        }
        .papers-login-card input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .papers-login-card input:focus {
            outline: none;
            border-color: #4a6da7;
        }
        .papers-login-card button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            border: none;
            border-radius: 8px;
            background: #2a2d35;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .papers-login-card button:hover {
            background: #1a1d23;
        }
        .papers-login-card .error-msg {
            color: #c0392b;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
        .papers-login-card .error-msg.show {
            display: block;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta property="og:title" content="Access Code — Adrian Mag">
    <meta property="og:description" content="Adrian Mag's academic website: seismology, inverse theory, and long-form notes on inference.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adrian-mag.github.io/pages/papers-login.html">
    <meta property="og:image" content="https://adrian-mag.github.io/media/og-card.png">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <div class="papers-login-card">
        <div class="lock-icon">&#128274;</div>
        <h1>Access Restricted</h1>
        <p>Please enter the access code to view the documents.</p>
        <form id="papers-login-form" autocomplete="off">
            <input type="password" id="papers-code-input" placeholder="Enter access code" autofocus>
            <button type="submit">Unlock</button>
        </form>
        <p class="error-msg" id="papers-error">Incorrect code. Please try again.</p>
    </div>

    <script src="../js/papers-crypto.js"></script>
    <script>
    (function () {
        "use strict";

        // The access code is the decryption key: it is verified by actually
        // decrypting a canary ciphertext (media/papers/vault-check.enc).
        // Nothing on this site or in its repository can reveal the documents
        // without the code.

        var form = document.getElementById("papers-login-form");
        var input = document.getElementById("papers-code-input");
        var errorMsg = document.getElementById("papers-error");
        var button = form.querySelector("button");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            var code = input.value;
            if (!code) return;
            errorMsg.classList.remove("show");
            button.disabled = true;
            button.textContent = "Checking…";

            window.PapersVault.verifyCode(code).then(function (ok) {
                if (ok) {
                    window.PapersVault.storeCode(code);
                    window.location.href = "papers-in-prep.html";
                } else {
                    button.disabled = false;
                    button.textContent = "Unlock";
                    errorMsg.classList.add("show");
                    input.value = "";
                    input.focus();
                }
            });
        });
    })();
    </script>
</body>
</html>
